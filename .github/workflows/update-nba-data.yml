name: Update NBA data

on:
  schedule:
    - cron: '0 11 * * *'   # ~6am America/New_York (11:00 UTC = 6am EDT / 7am EST).
                            # A single daily trigger — no DST gate needed. GitHub can
                            # delay scheduled runs by up to a couple hours on quiet
                            # repos, but since there's only one trigger per day there's
                            # nothing to gate against; it just runs whenever it fires.
  workflow_dispatch:
    inputs:
      accept_large_diff:
        description: 'Accept a diff above the 30% threshold'
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/scrape/requirements.txt

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Scrape
        run: python scripts/scrape/run.py

      - name: Generate data files
        run: node scripts/generate-from-scrape.js ${{ github.event.inputs.accept_large_diff == 'true' && '--accept-large-diff' || '' }}

      - name: Build smoke test
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload raw HTML for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-html
          path: snapshots/raw/
          retention-days: 7

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data/auto-update
          delete-branch: true
          title: 'Data update'
          commit-message: 'chore(data): scheduled scrape'
          body: |
            Automated scrape of Basketball Reference, RealGM, Hoops Rumors, and nbacaptracker.com.
            Check the run log for record counts and the diff summary.
          add-paths: |
            lib/player-data.ts
            lib/draft-picks.ts
            lib/rookie-years.ts
            lib/contract-details.ts
            lib/team-cap-state.ts
            snapshots/players.json
            snapshots/draft-picks.json
            snapshots/contract-details.json
            snapshots/team-cap-state.json
            snapshots/scraped/
